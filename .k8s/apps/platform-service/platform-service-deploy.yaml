apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-service-deploy
  namespace: dev-service
  labels:
    app.kubernetes.io/name: platform-service
    app.kubernetes.io/part-of: ai-base-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-service
    spec:
      containers:
        - name: platform-service
          image: platform-service:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: platform-service-cm
            - secretRef:
                name: platform-service-secret
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
